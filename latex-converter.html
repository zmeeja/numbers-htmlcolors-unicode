<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaTeX ↔ Markdown</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            /* margin: 0; */
            /* padding: 24px; */
            /* font-family: system-ui, sans-serif; */
            background: #f4f5f7;
            color: #222;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
        }

        .description {
            color: #666;
            margin-bottom: 20px;
        }

        .editors {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }

        label {
            font-weight: 600;
        }

        textarea {
            width: 100%;
            min-height: 350px;
            resize: vertical;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            color: #222;
            font: 14px/1.6 Consolas, monospace;
            tab-size: 4;
        }

        textarea:focus {
            outline: 2px solid #777;
            outline-offset: 1px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 16px 0;
        }

        button {
            padding: 10px 16px;
            border: 1px solid #ccc;
            border-radius: 7px;
            background: white;
            color: #222;
            cursor: pointer;
            font: inherit;
        }

        button:hover {
            background: #e8e8e8;
        }

        button.primary {
            background: #222;
            color: white;
            border-color: #222;
        }

        button.primary:hover {
            background: #444;
        }

        #status {
            min-height: 24px;
            color: #555;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            body {
                padding: 14px;
            }

            .editors {
                grid-template-columns: 1fr;
            }

            textarea {
                min-height: 220px;
            }
        }
    </style>
</head>

<body>
    <div>
        <a href="index.html">index</a>
        <a href="num_col_uni.html">numbers-htmlcolors-unicode</a>
        <a href="latex-converter.html">latex-converter</a>
    </div>
    <main>
        <h1>LaTeX ↔ Markdown</h1>

        <p class="description">
            Преобразование синтаксиса математических формул
            без изменения остального текста.
        </p>

        <div class="editors">
            <section class="panel">
                <label for="source">Исходный текст</label>
                <textarea id="source" placeholder="Сюда нужно вставить текст...&#10;Например:&#10;Формула: \(a+b\)&#10;&#10;\[&#10;a+b=c&#10;\]"
                    spellcheck="false"></textarea>
            </section>

            <section class="panel">
                <label for="result">Результат</label>
                <textarea id="result" placeholder="Здесь появится преобразованный текст...&#10;Например:&#10;Формула: $a+b$&#10;&#10;$$&#10;a+b=c&#10;$$"
                    spellcheck="false"></textarea>
            </section>
        </div>

        <div class="toolbar">
            <button class="primary" id="toMarkdown">Преобразовать</button>
            <!-- <button class="primary" id="toLatex">$ $ → \( \)</button> -->
            <button id="copy">Копировать результат</button>
            <button id="clear">Очистить</button>
        </div>

        <div id="status" role="status" aria-live="polite"></div>
    </main>

    <script>
        const source = document.getElementById("source");
        const result = document.getElementById("result");
        const status = document.getElementById("status");

        // LaTeX delimiters → Markdown delimiters.
        function toMarkdown(text) {
            return text
                // Блочные формулы с двойными обратными слешами:
                // \\[ ... \\] → $$ ... $$
                .replace(/\\\\\[((?:.|\n)*?)\\\\\]/g, (_, formula) =>
                    "$$\n" + formula.replace(/\\\*/g, "*").trim() + "\n$$"
                )

                // Блочные формулы с одинарными обратными слешами:
                // \[ ... \] → $$ ... $$
                .replace(/\\\[([\s\S]*?)\\\]/g, (_, formula) =>
                    "$$\n" + formula.replace(/\\\*/g, "*").trim() + "\n$$"
                )

                // Строчные формулы с двойными обратными слешами:
                // \\( ... \\) → $...$
                .replace(/\\\\\(((?:.|\n)*?)\\\\\)/g, (_, formula) =>
                    "$" + formula.replace(/\\\*/g, "*") + "$"
                )

                // Строчные формулы с одинарными обратными слешами:
                // \( ... \) → $...$
                .replace(/\\\(([\s\S]*?)\\\)/g, (_, formula) =>
                    "$" + formula.replace(/\\\*/g, "*") + "$"
                );
        }

        // function toMarkdown(text) {
        //     return text
        //         // Нормализация двойного экранирования.
        //         .replace(/\\\\/g, "\\")

        //         // Блочные формулы: \[ ... \] → $$ ... $$
        //         .replace(/\\\[([\s\S]*?)\\\]/g, (_, formula) =>
        //             "$$\n" + formula.replace(/\\\*/g, "*").trim() + "\n$$"
        //         )

        //         // Строчные формулы: \( ... \) → $ ... $
        //         .replace(/\\\(([\s\S]*?)\\\)/g, (_, formula) =>
        //             "$" + formula.replace(/\\\*/g, "*") + "$"
        //         );
        // }

        // Markdown delimiters → LaTeX delimiters.
        function toLatex(text) {
            // Временно сохраняем fenced code blocks,
            // чтобы не изменять примеры кода.
            const codeBlocks = [];

            text = text.replace(
                /(```[\s\S]*?```|~~~[\s\S]*?~~~)/g,
                block => {
                    codeBlocks.push(block);
                    return `\u0000CODE${codeBlocks.length - 1}\u0000`;
                }
            );

            // Сначала обрабатываем блочные формулы $$...$$.
            // Затем строчные $...$.
            text = text.replace(
                /(^|[^\\])\$\$([\s\S]*?)\$\$/g,
                (_, prefix, formula) =>
                    prefix + "\\[\n" + formula.trim() + "\n\\]"
            );

            text = text.replace(
                /(^|[^\\$])\$([^$\n]+?)\$(?!\$)/g,
                (_, prefix, formula) =>
                    prefix + "\\(" + formula + "\\)"
            );

            // Восстанавливаем исходные блоки кода.
            text = text.replace(
                /\u0000CODE(\d+)\u0000/g,
                (_, index) => codeBlocks[Number(index)]
            );

            return text;
        }

        // Кнопка 1: преобразовать левое поле в Markdown.
        document.getElementById("toMarkdown").addEventListener(
            "click",
            () => {
                result.value = toMarkdown(source.value);
                status.textContent = "Преобразование в Markdown выполнено.";
            }
        );

        // Кнопка 2: преобразовать левое поле в LaTeX-делимитеры.
        document.getElementById("toLatex").addEventListener(
            "click",
            () => {
                result.value = toLatex(source.value);
                status.textContent = "Преобразование в LaTeX выполнено.";
            }
        );

        // Копируем всё содержимое правого поля.
        document.getElementById("copy").addEventListener(
            "click",
            async () => {
                try {
                    await navigator.clipboard.writeText(result.value);
                    status.textContent = "Результат скопирован.";
                } catch {
                    // Запасной вариант для браузеров,
                    // в которых Clipboard API недоступен.
                    result.focus();
                    result.select();

                    const copied = document.execCommand("copy");

                    status.textContent = copied
                        ? "Результат скопирован."
                        : "Не удалось скопировать. Выделите текст вручную.";
                }
            }
        );

        // Очищаем оба поля.
        document.getElementById("clear").addEventListener(
            "click",
            () => {
                source.value = "";
                result.value = "";
                status.textContent = "";
                source.focus();
            }
        );
    </script>
</body>

</html>
