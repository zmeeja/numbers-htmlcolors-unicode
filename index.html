<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <script src="maps/colorsMap.js"></script>
    <script src="data/UnicodeData/unicodeMap.js"></script>
    <script src="data/UnicodeData/unicodeMapRu.js"></script>
    <script src="data/UnicodeBlocks/blocksMap.js"></script>
    <script src="maps/controlCharactersMap.js"></script>
    <script src="data/entities/entitiesMap.js"></script>
    <script src="maps/base64Map.js"></script>

    <script src="additionalDataTypes.js"></script>
    <script src="class_mynumber.js"></script>
    <script src="render.js"></script>
    <script src="renderTable.js"></script>
    <script src="renderLine.js"></script>
    <script src="buttonsSelector.js" defer></script>
    <script src="input.js" defer></script>

    <link rel="stylesheet" href="styleTable.css">
    <link rel="stylesheet" href="style.css">
    <script>
        // Событие DOMContentLoaded сработает после того, как все скрипты с defer 
        // завершат своё выполнение, а структура страницы будет полностью готова.
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Все скрипты загружены, выполняем финальный рендеринг...');
            render(range(128));
        });
    </script>
</head>
<body>
    <div id="buttonsSelector" style="background-color: plum; padding: 5px;">
        <button onclick="selector(this)" id="select1">Table</button>
        <button onclick="selector(this)" id="select2">Line</button>
        <button onclick="selector(this)" id="select3">.....</button>
    </div>
    <div style="background-color: cadetblue; padding: 5px; display: flex; flex-direction: row;">
        <button onclick="render(Object.keys(controlCharactersMap).sort().map(x => parseInt(x, 16)))"><b>U+0000..U+001F, U+007F, U+0080..U+009F</b><br><b>[0, 31]&#8746;{127}&#8746;[128, 159]</b><br><span style="color: red;">control</span> characters</button>
        <button onclick="render(Object.keys(colorsMap).sort().map(x => parseInt(x, 16)))">named HTML<br><span style="font-size: 24px;"><b><span style="color: blue;">c</span><span style="color: lime;">o</span><span style="color: aqua;">l</span><span style="color: red;">o</span><span style="color: fuchsia;">r</span><span style="color: yellow;">s</span></b></span></button>
        <button onclick="render(colorsMap1.sort().map(x => parseInt(x, 16)))">1</button>
        <button onclick="render(colorsMap2.sort().map(x => parseInt(x, 16)))">2</button>
        <button onclick="render(colorsMapBasic.sort().map(x => parseInt(x, 16)))">basic<br><span style="font-size: 24px;"><b><span style="color: blue;">c</span><span style="color: lime;">o</span><span style="color: aqua;">l</span><span style="color: red;">o</span><span style="color: fuchsia;">r</span><span style="color: yellow;">s</span></b></span></button>
        <button onclick="render(Object.keys(entitiesMap).sort().map(x => parseInt(x, 16)))">named HTML <b>entities</b><br><span style="font-size: 24px;"><code>&amp;nbsp;</code></span></button>
    </div>
    <div style="background-color: lightcoral; padding: 5px; display: flex; flex-direction: row;">
        <button onclick="render(range(128))"><b>U+0000..U+007F</b><br><b>[0, 127]<br></b>Basic Latin (ASCII)<br><span style="font-size: 24px;">abc</span></button>
        <button onclick="render(range(128, 256))"><b>U+0080..U+00FF</b><br><b>[128, 255]<br></b>Latin-1 Supplement<br><span style="font-size: 24px;">©®Æ</span></button>
        <button onclick="render(range(0x0370, parseInt(0x03FF)+1))"><b>U+0370..U+03FF</b><br><b>[880, 1023]</b><br>Greek and Coptic<br><span style="font-size: 24px;">αβγ</span></button>
        <button onclick="render(range(0x0400, parseInt(0x04FF)+1))"><b>U+0400..U+04FF</b><br><b>[1024, 1279]</b><br>Cyrillic<br><span style="font-size: 24px;">абв</span></button>
        <button onclick="render(range(0x2200, parseInt(0x22FF)+1))"><b>U+2200..U+22FF</b><br><b>[8704, 8959]</b><br>Mathematical Operators<br><span style="font-size: 24px;">∑</span></button>
        <button onclick="render(range(0x1F600, parseInt(0x1F64F)+1))"><b>U+1F600..U+1F64F</b><br><b>[8352, 8295]</b><br>Emoticons<br><span style="font-size: 24px;">😀</span></button>
    </div>
    <div style="background-color: lightgreen; padding: 5px;">
        <select id="selectUnicodeBlocks" onchange="render(range(selectUnicodeBlocks.value.split('-')[0], parseInt(selectUnicodeBlocks.value.split('-')[1])+1))"></select>
    </div>
    <script>
        const selectUnicodeBlocks = document.getElementById("selectUnicodeBlocks");
        for (let i of blocksMap) {
            let option = document.createElement("option");
            option.value = i[0] + "-" + i[1];
            option.textContent = i[2] + " [" + i[0] + ".." + i[1] + "]";
            selectUnicodeBlocks.appendChild(option);
        }
    </script>
    <div style="background-color: palevioletred; padding: 5px;">
        <button onclick="selector2(this)" id="select21">UNI</button>
        <button onclick="selector2(this)" id="select22">DEC</button>
        <button onclick="selector2(this)" id="select23">BIN</button>
        <button onclick="selector2(this)" id="select24">OCT</button>
        <button onclick="selector2(this)" id="select25">HEX</button>
        <button onclick="selector2(this)" id="select27">name</button>
        <button onclick="selector2(this)" id="select28">color</button>
        <button onclick="selector2(this)" id="select26">entity</button>
        <input type="text" id="textInput">
    </div>
    <div style="background-color: SkyBlue; padding: 5px;">
        newline Windows: <span style="color: yellow;">\r\n</span>
        newline Unix/macOS: <span style="color: yellow;">\n</span>
    </div>
    <!-- <div>
        <b>ip address</b> (32bit), <b>port</b> (16bit) <b>DEC:</b> XXX.XXX.XXX.XXX:XXXXX<br>
        <b>UTF-32</b> (32bit) <b>HEX:</b> XXXXXXXX
    </div> -->
    <div id="contener">
    </div>
</body>
</html>
