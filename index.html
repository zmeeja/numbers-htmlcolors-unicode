<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <script src="data/colors/colorsMap.js"></script>
    <script src="data/UnicodeData/unicodeMap.js"></script>
    <script src="data/Ru/unicodeMapRu1.js"></script>
    <script src="data/UnicodeBlocks/blocksMap.js"></script>
    <script src="data/controlCharactersMap.js"></script>
    <script src="data/entities/entitiesMap.js"></script>
    <script src="data/base64Map.js"></script>
    <script src="data/CP/CP437Map.js"></script>
    <script src="data/CP/CP866Map.js"></script>
    <script src="data/CP/CP1251Map.js"></script>
    <script src="data/CP/CP1252Map.js"></script>
    <script src="data/LaTeX/LaTeXmap.js"></script>

    <script src="js/additionalDataTypes.js"></script>
    <script src="js/class_mynumber.js"></script>
    <script src="js/render.js"></script>
    <script src="js/renderTable.js"></script>
    <script src="js/renderBox.js"></script>
    <script src="js/buttonsSelector.js" defer></script>
    <script src="js/input.js" defer></script>
    <script src="js/other.js"></script>
    <script src="js/time.js" defer></script>

    <link rel="stylesheet" href="css/styleTable.css">
    <link rel="stylesheet" href="css/styleBox.css">
    <link rel="stylesheet" href="css/style.css">
    <script>
        // Событие DOMContentLoaded сработает после того, как все скрипты с defer 
        // завершат своё выполнение, а структура страницы будет полностью готова.
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Все скрипты загружены, выполняем финальный рендеринг...');
            render(range(128));
        });
    </script>
</head>
<body>
    <div style="padding: 5px; border: 1px solid black; background-color: LightGray;">
        <span style="font-size: 30px;">Unicode</span>
    </div>
    <div id="buttonsSelector" style="border: 1px solid black; padding: 5px; display: flex; background-color: LightGray;">
        <button onclick="selector(this)" id="select1">Table</button>
        <button onclick="selector(this)" id="select2">Box</button>
        <button onclick="selector(this)" id="select3" style="display: none;">...</button>
        <div style="flex-grow: 1; text-align: right; padding: 5px;"><b>Unix time</b> (1 January 1970, 00:00:00 UTC)</div>
        <div style="background-color: white; padding: 5px;" id="time"></div>
    </div>
    <div style="border: 1px solid black; padding: 5px; background-color: LightGray;">
        <button onclick="render([47])">path separator<br>in Linux/macOS/Unix<br><span style="font-size: 24px;">/</span></button>
    </div>
    <div style="border: 1px solid black; padding: 5px; display: flex; flex-direction: row; background-color: LightGray;">
        <button onclick="render(Object.keys(controlCharactersMap).sort().map(x => parseInt(x, 16)))"><b>U+0000..U+001F, U+007F, U+0080..U+009F</b><br><b>[0, 31]&#8746;{127}&#8746;[128, 159]</b><br><span style="color: red;">control</span> characters</button>
        <button onclick="render(Object.keys(entitiesMap).sort().map(x => parseInt(x, 16)))">named HTML <b>entities</b><br><span style="font-size: 24px;"><code>&amp;nbsp;</code></span></button>
        <button onclick="render(Object.keys(LaTeXmap).sort().map(x => parseInt(x, 16)))"><b>LaTeX</b><br><span style="font-size: 24px;"><code>\alpha</code></span></button>
    </div>
    <div style="border: 1px solid black; padding: 5px; display: flex; flex-direction: row; background-color: LightGray;">
        <button onclick="render(Object.keys(colorsMap).sort().map(x => parseInt(x, 16)))">named HTML<br><span style="font-size: 24px;"><b><span style="color: blue;">c</span><span style="color: lime;">o</span><span style="color: aqua;">l</span><span style="color: red;">o</span><span style="color: fuchsia;">r</span><span style="color: yellow;">s</span></b></span></button>
        <button onclick="render(Object.keys(colorsMap).filter(x => colorsMap[x].length == 1).sort().map(x => parseInt(x, 16)))">1</button>
        <button onclick="render(Object.keys(colorsMap).filter(x => colorsMap[x].length !== 1).sort().map(x => parseInt(x, 16)))">2</button>
        <button onclick='render(["000000", "FFFFFF", "FF0000", "00FF00", "0000FF", "FFFF00", "FF00FF", "00FFFF"].sort().map(x => parseInt(x, 16)))'>basic<br><span style="font-size: 24px;"><b><span style="color: blue;">c</span><span style="color: lime;">o</span><span style="color: aqua;">l</span><span style="color: red;">o</span><span style="color: fuchsia;">r</span><span style="color: yellow;">s</span></b></span></button>
        <button onclick='render(range(0, 256).map(x => "0x" + x.toString(16).padStart(2, "0") + x.toString(16).padStart(2, "0") + x.toString(16).padStart(2, "0")))'><span style='color: Gray'><b>grey</b></span></button>
        <button onclick='render(range(0, 256).map(x => "0x" + x.toString(16).padStart(2, "0") + "0000"))'><span style='color: Red'><b>R</b></span></button>
        <button onclick='render(range(0, 256).map(x => "0x" + "00" + x.toString(16).padStart(2, "0") + "00"))'><span style='color: Lime'><b>G</b></span></button>
        <button onclick='render(range(0, 256).map(x => "0x" + "0000" + x.toString(16).padStart(2, "0")))'><span style='color: Blue'><b>B</b></span></button>
    </div>
    <div style="border: 1px solid black; padding: 5px; display: flex; flex-direction: row; background-color: LightGray;">
        <button onclick="render(range(128))"><b>U+0000..U+007F</b><br><b>[0, 127]<br></b>Basic Latin (ASCII)<br><span style="font-size: 24px;">abc</span></button>
        <button onclick="render(range(128, 256))"><b>U+0080..U+00FF</b><br><b>[128, 255]<br></b>Latin-1 Supplement<br><span style="font-size: 24px;">©®Æ</span></button>
        <button onclick="render(range(0x0370, parseInt(0x03FF)+1))"><b>U+0370..U+03FF</b><br><b>[880, 1023]</b><br>Greek and Coptic<br><span style="font-size: 24px;">αβγ</span></button>
        <button onclick="render(range(0x0400, parseInt(0x04FF)+1))"><b>U+0400..U+04FF</b><br><b>[1024, 1279]</b><br>Cyrillic<br><span style="font-size: 24px;">абв</span></button>
        <button onclick="render(range(0x2200, parseInt(0x22FF)+1))"><b>U+2200..U+22FF</b><br><b>[8704, 8959]</b><br>Mathematical Operators<br><span style="font-size: 24px;">∑</span></button>
        <button onclick="render(range(0x1F600, parseInt(0x1F64F)+1))"><b>U+1F600..U+1F64F</b><br><b>[8352, 8295]</b><br>Emoticons<br><span style="font-size: 24px;">😀</span></button>
    </div>
    <div style="border: 1px solid black; padding: 5px; background-color: LightGray;">
        <select id="selectUnicodeBlocks" onchange="render(range(selectUnicodeBlocks.value.split('-')[0], parseInt(selectUnicodeBlocks.value.split('-')[1])+1))"></select>
    </div>
    <script>
        const selectUnicodeBlocks = document.getElementById("selectUnicodeBlocks");
        for (let i of blocksMap) {
            let option = document.createElement("option");
            option.value = i[0] + "-" + i[1];
            option.textContent = i[2] + " [" + i[0] + ".." + i[1] + "]";
            selectUnicodeBlocks.appendChild(option);
        }
    </script>
    <div style="border: 1px solid black; padding: 5px; background-color: LightGray;">
        <button onclick="selector2(this)" id="select21">UNI</button>
        <button onclick="selector2(this)" id="select22">DEC</button>
        <button onclick="selector2(this)" id="select23">BIN</button>
        <button onclick="selector2(this)" id="select24">OCT</button>
        <button onclick="selector2(this)" id="select25">HEX</button>
        <button onclick="selector2(this)" id="select27">name</button>
        <button onclick="selector2(this)" id="select29">name Ru</button>
        <button onclick="selector2(this)" id="select28">color</button>
        <button onclick="selector2(this)" id="select26">entity</button>
        <button onclick="selector2(this)" id="select30">LaTeX</button>
        <input type="text" id="textInput">
    </div>
    <div style="border: 1px solid black; padding: 5px; background-color: LightGray;">
        newline Windows: <span style="color: red;" onclick="render([13, 10])">\r\n</span>
        newline Linux/macOS/Unix: <span style="color: red;" onclick="render([10])">\n</span><br>
        path separator in Windows: <span style="color: red;" onclick="render([92])">\</span>
        path separator in Linux/macOS/Unix: <span style="color: red;" onclick="render([47])">/</span>
    </div>
    <!-- <div>
        <b>ip address</b> (32bit), <b>port</b> (16bit) <b>DEC:</b> XXX.XXX.XXX.XXX:XXXXX<br>
        <b>UTF-32</b> (32bit) <b>HEX:</b> XXXXXXXX
    </div> -->
    <div style="border: 1px solid black; padding: 5px; background-color: LightGray;">
        <input type="range" min="0" max="255" value="0" id="myRange1">
        <input type="range" min="0" max="255" value="0" id="myRange2">
        <input type="range" min="0" max="255" value="0" id="myRange3">
    </div>
    <div style="border: 1px solid black; padding: 5px; background-color: LightGray;">
        <input type="range" min="0" max="255" value="0" id="myRange">
    </div>
    <div id="contener" style="border: 1px solid black; padding: 5px; background-color: white;"></div>
</body>
</html>
